name: Bash validation
on:
  push:
  pull_request:
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax and scripts
        run: |
          bash -n install.sh status.sh uninstall.sh
          shellcheck --severity=warning install.sh status.sh uninstall.sh
          bash install.sh --help
          bash uninstall.sh --help
